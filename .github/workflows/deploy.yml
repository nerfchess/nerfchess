name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at once; queue instead of cancelling so every
# master commit eventually ships.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::The CLOUDFLARE_API_TOKEN repository secret is not set. Create an API token at https://dash.cloudflare.com/profile/api-tokens with the 'Edit Cloudflare Workers' template plus D1 edit permission, then add it (and CLOUDFLARE_ACCOUNT_ID) under Settings → Secrets and variables → Actions."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js + OpenNext Cloudflare bundle)
        run: npx opennextjs-cloudflare build

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nerfchess --remote

      - name: Deploy worker
        run: npx wrangler deploy
