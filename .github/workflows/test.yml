name: Test

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (rules & nerfs)
    runs-on: [self-hosted, linux, tokyo]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:rules and test:nerfs each run `server:build` (tsc) first, so this
      # also validates the standalone Node game server compiles.
      - name: Rule / buff tests
        run: npm run test:rules

      - name: Nerf tests
        run: npm run test:nerfs

      # Passive visual registry coverage + integrity: every implemented passive
      # nerf and kind:"passive" buff has a unique, in-budget visual tuple. Fails
      # the build on any uncovered passive (docs/passive-effect-language.md).
      - name: Passive effect registry tests
        run: npm run test:passive-registry

      # Every tier-9 apex / tier-10 mythic card activated end-to-end, plus the
      # bank-at-top apex offer's shape and mythic-upgrade rate.
      - name: Apex / mythic tests
        run: node scripts/test-apex.cjs

      # Replica-replay determinism: a client desyncing from the authoritative
      # worker is the single worst production bug this game can have, so the
      # desync harness gates every PR alongside the rule suites.
      - name: Desync / replay determinism tests
        run: node scripts/test-desync.cjs

      - name: Snapshot tests
        run: node scripts/test-snapshot.cjs

      # Spectator / TV public-projection tests: the reducer ordering unit checks,
      # plus the full pipeline (snapshot sanitization, every board-mutating card's
      # spectator-parity, and join / reconnect / resync / failover integration).
      - name: Spectator sync reducer tests
        run: npm run test:spectator-sync

      - name: Replay / spectate reconstruction tests
        run: node scripts/test-replay-spectate.cjs

      # Archived-draft-record replay: the public-filtered archive stream (with a
      # board-rewriting card) rebuilds every ply of the live board via the exact
      # draftOnline client path, and raw grant/reroll actions never leak.
      - name: Archived draft record replay tests
        run: npm run test:archive-replay

      - name: TV / spectator public-projection tests
        run: npm run test:tv-spectator

      # Production-safe snapshot validator self-test: reconstruct, build the
      # public snapshot, recompute the parity hash, and assert no secret field
      # leaks and versions are compatible (one-shot, logs ids + hashes only).
      - name: TV snapshot validator (self-test)
        run: node scripts/validate-tv-snapshots.cjs --selftest

      # Notation: no two legal moves in a position may share a SAN, or the move
      # list lies and exported PGNs cannot be replayed by any reader.
      - name: SAN notation tests
        run: npm run test:san

      # Cards must measurably change the game, not merely avoid throwing. The
      # lab gate only catches crashes; this catches silence.
      - name: Card impact tests
        run: npm run test:card-impact

      # Arena seat identity: a house bot's rating must come from the database on
      # every surface, never from the arena's baked persona constant.
      - name: Arena seat tests
        run: npm run test:arena-seat

      # Rating math.
      - name: Glicko tests
        run: npm run test:glicko

  # Content and registry gates. These are pure library checks (no server:build,
  # no engine replay), so they run as their own job in parallel with the engine
  # suite rather than lengthening it. Every one of these already passed locally
  # but none of them gated a PR before.
  content:
    name: Content & registry gates
    runs-on: [self-hosted, linux, tokyo]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every tier 1-8 card has a flagship animation, no two share an identical
      # dressing, and the shared-flagship count never grows (ratchet against
      # scripts/anim-baseline.json).
      - name: Animation registry
        run: npm run test:animations

      # Every passive composition carries a sound cue and every cue family has a
      # wired voice.
      - name: Sound coverage
        run: npm run test:sound

      # Derived registries must match the engine tables they are generated from.
      - name: Card registry
        run: npm run test:card-registry

      - name: Card audit
        run: npm run test:card-audit

      # Standing house rule: no em dashes in user-visible text.
      - name: Em dash guard
        run: npm run test:emdash

      # Draft RNG fairness, offer sequencing, and deadline handling.
      - name: Draft fairness
        run: npm run test:draft-fairness

      - name: Draft sequence
        run: npm run test:draft-sequence

      - name: Draft timeout
        run: npm run test:draft-timeout

      # Buff mode must never reference Nerfs in user-visible text.
      - name: Buff-mode purity
        run: npm run test:buff-purity

      - name: Balance fixes
        run: npm run test:balance-fixes
