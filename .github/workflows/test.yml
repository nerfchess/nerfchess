name: Test

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (rules & nerfs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # test:rules and test:nerfs each run `server:build` (tsc) first, so this
      # also validates the standalone Node game server compiles.
      - name: Rule / buff tests
        run: npm run test:rules

      - name: Nerf tests
        run: npm run test:nerfs
