name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (Next.js + OpenNext Cloudflare bundle)
        run: npx opennextjs-cloudflare build

      - name: Validate worker (wrangler dry run)
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
