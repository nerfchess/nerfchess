<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Cup of coffee">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6d8c4"/><stop offset="1" stop-color="#c7b298"/></linearGradient>
    <linearGradient id="cm-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5f3a"/><stop offset="1" stop-color="#5f3f24"/></linearGradient>
    <linearGradient id="cm-mug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f0e8"/><stop offset="0.5" stop-color="#e2dccf"/><stop offset="1" stop-color="#c9c0af"/></linearGradient>
    <radialGradient id="cm-coffee" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#6b4326"/><stop offset="1" stop-color="#3f2614"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#cm-bg)"/>
  <rect x="0" y="128" width="200" height="72" fill="url(#cm-table)"/>
  <path d="M0 128 H200" stroke="#4a2f1a" stroke-width="2" opacity="0.5"/>
  <g stroke="#6e472a" stroke-width="1" opacity="0.4"><path d="M0 150 H200 M0 172 H200"/></g>
  <!-- steam -->
  <g stroke="#efe6d6" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M88 74 q8 -10 0 -20 q-8 -10 0 -22"/>
    <path d="M112 74 q-8 -10 0 -20 q8 -10 0 -22"/>
  </g>
  <!-- saucer -->
  <ellipse cx="100" cy="166" rx="58" ry="14" fill="#e2dccf"/>
  <ellipse cx="100" cy="164" rx="58" ry="12" fill="#f2ede2"/>
  <ellipse cx="100" cy="163" rx="40" ry="8" fill="#d6cdbb"/>
  <!-- handle -->
  <path d="M142 108 q26 2 24 24 q-2 20 -26 18" fill="none" stroke="url(#cm-mug)" stroke-width="10"/>
  <path d="M142 108 q26 2 24 24 q-2 20 -26 18" fill="none" stroke="#b7ac98" stroke-width="4" opacity="0.5"/>
  <!-- mug body -->
  <path d="M56 92 H144 L138 152 Q100 164 62 152 Z" fill="url(#cm-mug)"/>
  <ellipse cx="100" cy="92" rx="44" ry="12" fill="#d6cdbb"/>
  <ellipse cx="100" cy="92" rx="38" ry="9" fill="url(#cm-coffee)"/>
  <ellipse cx="100" cy="91" rx="30" ry="6" fill="#5a3620" opacity="0.6"/>
  <path d="M78 90 q22 6 44 0" stroke="#a9754a" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- foam heart -->
  <path d="M100 88 q-5 -6 -10 -2 q-4 4 10 12 q14 -8 10 -12 q-5 -4 -10 2 z" fill="#e6cba8" opacity="0.7"/>
  <path d="M62 100 q-2 26 4 48" stroke="#ffffff" stroke-width="3" opacity="0.35" fill="none"/>
  <ellipse cx="100" cy="166" rx="58" ry="14" fill="none" stroke="#c2b8a4" stroke-width="1" opacity="0.6"/>
</svg>
