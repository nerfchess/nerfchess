<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Teapot and cup">
  <defs>
    <linearGradient id="tt-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6ddcb"/><stop offset="1" stop-color="#cbbda2"/></linearGradient>
    <linearGradient id="tt-table" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b58f6a"/><stop offset="1" stop-color="#8a6642"/></linearGradient>
    <linearGradient id="tt-pot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8a0b0"/><stop offset="1" stop-color="#c2607a"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#tt-bg)"/>
  <rect x="0" y="146" width="200" height="54" fill="url(#tt-table)"/>
  <path d="M0 146 H200" stroke="#6e4a2c" stroke-width="2" opacity="0.5"/>
  <ellipse cx="76" cy="150" rx="52" ry="10" fill="#000000" opacity="0.12"/>
  <ellipse cx="150" cy="156" rx="24" ry="6" fill="#000000" opacity="0.12"/>
  <!-- steam -->
  <g stroke="#e8ddc8" stroke-width="2.5" fill="none" opacity="0.5" stroke-linecap="round"><path d="M76 74 q6 -8 0 -16 q-6 -8 0 -16"/><path d="M150 118 q4 -6 0 -12"/></g>
  <!-- teapot -->
  <path d="M40 120 Q40 84 76 84 Q112 84 112 120 Q112 148 76 148 Q40 148 40 120 Z" fill="url(#tt-pot)"/>
  <ellipse cx="76" cy="118" rx="36" ry="30" fill="none" stroke="#a84f68" stroke-width="1" opacity="0.4"/>
  <!-- spout -->
  <path d="M40 108 Q18 100 12 84 Q22 90 26 96 Q34 100 44 104 Z" fill="url(#tt-pot)"/>
  <!-- handle -->
  <path d="M110 104 q22 -4 20 20 q-2 16 -18 16" fill="none" stroke="#c2607a" stroke-width="7"/>
  <!-- lid -->
  <ellipse cx="76" cy="86" rx="26" ry="7" fill="#d98098"/>
  <path d="M56 84 Q76 72 96 84 Z" fill="#e8a0b0"/>
  <circle cx="76" cy="72" r="5" fill="#f6c451"/>
  <!-- floral -->
  <g fill="#f6d9e2" opacity="0.8"><circle cx="66" cy="116" r="5"/><circle cx="86" cy="124" r="5"/><circle cx="76" cy="132" r="4"/></g>
  <g fill="#c2607a"><circle cx="66" cy="116" r="2"/><circle cx="86" cy="124" r="2"/></g>
  <path d="M52 118 q6 -6 14 -2 M92 130 q6 -8 0 -14" stroke="#6b9a5a" stroke-width="1.4" fill="none" opacity="0.7"/>
  <!-- cup -->
  <path d="M132 120 H168 L164 142 Q150 148 136 142 Z" fill="#e8a0b0"/>
  <ellipse cx="150" cy="120" rx="18" ry="5" fill="#c2607a"/>
  <ellipse cx="150" cy="120" rx="13" ry="3.4" fill="#7a4326"/>
  <path d="M168 124 q10 0 9 10 q-1 8 -9 8" fill="none" stroke="#e8a0b0" stroke-width="4"/>
  <ellipse cx="150" cy="150" rx="26" ry="6" fill="#d98098"/>
  <ellipse cx="150" cy="149" rx="26" ry="5" fill="#e8a0b0"/>
</svg>
