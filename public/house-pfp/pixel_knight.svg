<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Pixel-art chess knight" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="pk-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c096c"/><stop offset="1" stop-color="#10002b"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#pk-bg)"/>
  <!-- pixel starfield -->
  <g fill="#ffe45e">
    <rect x="28" y="30" width="6" height="6"/><rect x="160" y="42" width="6" height="6"/>
    <rect x="44" y="150" width="6" height="6"/><rect x="152" y="140" width="6" height="6"/>
  </g>
  <!-- 12px-grid knight, drawn as chunky pixels -->
  <g fill="#e6e9f2">
    <rect x="88" y="40" width="12" height="12"/>
    <rect x="76" y="52" width="36" height="12"/>
    <rect x="64" y="64" width="60" height="12"/>
    <rect x="52" y="76" width="84" height="12"/>
    <rect x="52" y="88" width="36" height="12"/><rect x="100" y="88" width="36" height="12"/>
    <rect x="88" y="100" width="48" height="12"/>
    <rect x="76" y="112" width="60" height="12"/>
    <rect x="76" y="124" width="60" height="12"/>
    <rect x="64" y="136" width="84" height="12"/>
    <rect x="52" y="148" width="108" height="12"/>
  </g>
  <!-- eye + mane shading pixels -->
  <rect x="76" y="76" width="12" height="12" fill="#20242e"/>
  <g fill="#b8c0d4">
    <rect x="124" y="88" width="12" height="12"/><rect x="124" y="112" width="12" height="12"/><rect x="124" y="124" width="12" height="12"/>
  </g>
  <!-- base plate -->
  <rect x="40" y="160" width="132" height="12" fill="#8a6a1f"/>
  <rect x="40" y="160" width="132" height="4" fill="#d9a520"/>
</svg>
