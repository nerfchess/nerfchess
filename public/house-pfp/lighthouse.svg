<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Lighthouse on the coast">
  <defs>
    <linearGradient id="lh-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#39557f"/><stop offset="0.6" stop-color="#e79a72"/><stop offset="1" stop-color="#f6c78e"/></linearGradient>
    <linearGradient id="lh-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a7ba0"/><stop offset="1" stop-color="#274a68"/></linearGradient>
    <linearGradient id="lh-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b6255"/><stop offset="1" stop-color="#443d33"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#lh-sky)"/>
  <circle cx="150" cy="70" r="18" fill="#fff0cc" opacity="0.85"/>
  <g fill="#e79a72" opacity="0.5"><ellipse cx="46" cy="40" rx="30" ry="6"/><ellipse cx="90" cy="52" rx="18" ry="4"/></g>
  <rect x="0" y="120" width="200" height="80" fill="url(#lh-sea)"/>
  <!-- cliff -->
  <path d="M0 200 L0 130 Q40 118 80 132 L80 200 Z" fill="url(#lh-rock)"/>
  <path d="M0 138 Q40 126 80 140" fill="none" stroke="#7a715f" stroke-width="2" opacity="0.6"/>
  <g fill="#4f6b3a"><ellipse cx="20" cy="128" rx="14" ry="6"/><ellipse cx="54" cy="132" rx="12" ry="5"/></g>
  <!-- lighthouse -->
  <path d="M34 128 L30 62 L50 62 L46 128 Z" fill="#f2efe8"/>
  <g fill="#d34534"><path d="M31 100 L49 100 L48.4 112 L31.6 112 Z"/><path d="M30.4 76 L49.6 76 L49 88 L31 88 Z"/></g>
  <rect x="28" y="56" width="24" height="8" fill="#3a3f4a"/>
  <rect x="33" y="42" width="14" height="16" fill="#2a2f38"/>
  <rect x="35" y="44" width="10" height="12" fill="#ffd45e"/>
  <path d="M33 42 L47 42 L44 34 L36 34 Z" fill="#d34534"/>
  <circle cx="40" cy="30" r="2" fill="#3a3f4a"/>
  <!-- light beams -->
  <g fill="#fff1b8" opacity="0.35"><path d="M45 50 L200 20 L200 44 L45 54 Z"/><path d="M45 52 L200 76 L200 100 L45 58 Z"/></g>
  <!-- waves -->
  <g stroke="#cfe4f2" stroke-width="1.5" opacity="0.6" fill="none" stroke-linecap="round"><path d="M100 150 q12 -4 24 0 q12 4 24 0 M120 168 q14 -4 28 0 M150 182 q12 -4 24 0"/></g>
  <g fill="#ffffff" opacity="0.8"><circle cx="82" cy="150" r="2"/><circle cx="90" cy="160" r="1.6"/></g>
</svg>
