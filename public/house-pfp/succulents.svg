<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Succulents on a windowsill">
  <defs>
    <linearGradient id="su-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0ea"/><stop offset="1" stop-color="#e8f0e2"/></linearGradient>
    <linearGradient id="su-sill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe8db"/><stop offset="1" stop-color="#d2c6b0"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="#e6ddcb"/>
  <!-- window with view -->
  <rect x="16" y="16" width="168" height="118" rx="4" fill="url(#su-sky)"/>
  <g fill="#a9cf8f" opacity="0.7"><ellipse cx="50" cy="110" rx="40" ry="20"/><ellipse cx="140" cy="112" rx="46" ry="22"/></g>
  <circle cx="150" cy="44" r="12" fill="#fff3c0" opacity="0.8"/>
  <g fill="#ffffff" opacity="0.8"><ellipse cx="54" cy="44" rx="20" ry="6"/><ellipse cx="90" cy="60" rx="14" ry="4"/></g>
  <rect x="16" y="16" width="168" height="118" rx="4" fill="none" stroke="#b8a888" stroke-width="6"/>
  <line x1="100" y1="16" x2="100" y2="134" stroke="#b8a888" stroke-width="5"/>
  <!-- sill -->
  <rect x="6" y="134" width="188" height="18" rx="2" fill="url(#su-sill)"/>
  <path d="M6 134 H194" stroke="#c2b498" stroke-width="1.5"/>
  <!-- pot 1 terracotta -->
  <path d="M28 152 h30 l-3 30 h-24 z" fill="#c9764a"/>
  <path d="M26 148 h34 v6 h-34 z" fill="#dd8a5c"/>
  <g fill="#4f8a54"><ellipse cx="43" cy="140" rx="4" ry="10"/><ellipse cx="35" cy="144" rx="4" ry="9" transform="rotate(-30 35 144)"/><ellipse cx="51" cy="144" rx="4" ry="9" transform="rotate(30 51 144)"/><ellipse cx="39" cy="138" rx="3.4" ry="8"/><ellipse cx="47" cy="138" rx="3.4" ry="8"/></g>
  <circle cx="43" cy="140" r="3" fill="#7fb86a"/>
  <!-- pot 2 white cactus -->
  <path d="M88 152 h26 l-2 30 h-22 z" fill="#e8e2d6"/>
  <path d="M86 148 h30 v6 h-30 z" fill="#f2ede2"/>
  <g fill="#3f7a44"><rect x="96" y="122" width="8" height="30" rx="4"/><rect x="90" y="132" width="6" height="16" rx="3"/><rect x="104" y="128" width="6" height="20" rx="3"/></g>
  <g stroke="#dfe6c0" stroke-width="0.8"><path d="M100 124 v26 M92 134 v12 M107 130 v16"/></g>
  <circle cx="100" cy="122" r="3" fill="#f0a0b8"/>
  <!-- pot 3 blue rosette -->
  <path d="M144 152 h28 l-2 30 h-24 z" fill="#5f9ab0"/>
  <path d="M142 148 h32 v6 h-32 z" fill="#77b2c6"/>
  <g fill="#8fbf7a"><ellipse cx="158" cy="142" rx="5" ry="8"/><ellipse cx="150" cy="146" rx="5" ry="7" transform="rotate(-35 150 146)"/><ellipse cx="166" cy="146" rx="5" ry="7" transform="rotate(35 166 146)"/><ellipse cx="154" cy="140" rx="4" ry="6"/><ellipse cx="162" cy="140" rx="4" ry="6"/></g>
  <circle cx="158" cy="143" r="3.4" fill="#c2e0a8"/>
</svg>
