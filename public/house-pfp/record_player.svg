    <linearGradient id="rp-base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a06a"/><stop offset="1" stop-color="#96693c"/></linearGradient>
    <radialGradient id="rp-vinyl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#111111"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#rp-bg)"/>
  <g fill="#ffffff" opacity="0.12"><circle cx="40" cy="40" r="14"/><circle cx="164" cy="54" r="20"/><circle cx="150" cy="30" r="8"/></g>
  <!-- base -->
  <rect x="24" y="60" width="152" height="120" rx="8" fill="url(#rp-base)"/>
