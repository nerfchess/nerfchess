  <circle cx="92" cy="118" r="52" fill="#2a2a2a"/>
  <circle cx="92" cy="118" r="48" fill="url(#rp-vinyl)"/>
  <g fill="none" stroke="#3a3a3a" stroke-width="1"><circle cx="92" cy="118" r="42"/><circle cx="92" cy="118" r="36"/><circle cx="92" cy="118" r="30"/><circle cx="92" cy="118" r="24"/></g>
  <circle cx="92" cy="118" r="16" fill="#d94f4f"/>
