<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Rainy neon street">
  <defs>
    <linearGradient id="rn-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1330"/><stop offset="1" stop-color="#3a2450"/></linearGradient>
    <linearGradient id="rn-street" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2038"/><stop offset="1" stop-color="#120c1c"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#rn-sky)"/>
  <!-- buildings -->
  <g fill="#241a38"><rect x="0" y="40" width="46" height="110"/><rect x="50" y="24" width="40" height="126"/><rect x="94" y="52" width="34" height="98"/><rect x="132" y="30" width="30" height="120"/><rect x="166" y="60" width="34" height="90"/></g>
  <!-- neon signs -->
  <g>
    <rect x="8" y="70" width="30" height="10" rx="2" fill="none" stroke="#ff3d8a" stroke-width="2.5"/>
    <rect x="58" y="56" width="10" height="40" rx="2" fill="none" stroke="#3df2f2" stroke-width="2.5"/>
    <circle cx="110" cy="78" r="10" fill="none" stroke="#f6d24a" stroke-width="2.5"/>
    <rect x="138" y="60" width="18" height="8" rx="2" fill="none" stroke="#8a5fff" stroke-width="2.5"/>
    <rect x="172" y="84" width="8" height="30" rx="2" fill="none" stroke="#3dff8a" stroke-width="2.5"/>
  </g>
  <g fill="#ffd45e" opacity="0.9"><rect x="20" y="96" width="3" height="4"/><rect x="72" y="70" width="3" height="4"/><rect x="102" y="100" width="3" height="4"/><rect x="144" y="90" width="3" height="4"/><rect x="180" y="100" width="3" height="4"/><rect x="30" y="110" width="3" height="4"/></g>
  <!-- rain -->
  <g stroke="#8fb4e0" stroke-width="1" opacity="0.4"><path d="M20 20 l-6 20 M50 10 l-6 24 M80 24 l-6 20 M120 12 l-6 22 M150 20 l-6 20 M180 14 l-6 22 M35 40 l-5 18 M100 40 l-5 18 M165 44 l-5 16"/></g>
  <!-- street -->
  <rect x="0" y="150" width="200" height="50" fill="url(#rn-street)"/>
  <!-- reflections -->
  <g opacity="0.4">
    <rect x="8" y="150" width="30" height="30" fill="#ff3d8a"/>
    <rect x="60" y="150" width="8" height="40" fill="#3df2f2"/>
    <rect x="106" y="150" width="8" height="34" fill="#f6d24a"/>
    <rect x="140" y="150" width="14" height="30" fill="#8a5fff"/>
    <rect x="174" y="150" width="6" height="36" fill="#3dff8a"/>
  </g>
  <g stroke="#000000" stroke-width="2" opacity="0.4"><path d="M0 162 H200 M0 174 H200 M0 186 H200"/></g>
  <path d="M96 150 h8 v50 h-8 z" fill="#f6d24a" opacity="0.3"/>
</svg>
