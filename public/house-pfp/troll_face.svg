  <path d="M110 86 q16 -12 32 2" stroke="#20242e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="84" cy="94" r="5" fill="#20242e"/>
  <circle cx="126" cy="94" r="5" fill="#20242e"/>
