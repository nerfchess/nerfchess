<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mischievous troll grin">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c7a89"/><stop offset="1" stop-color="#2b3440"/></linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#tf-bg)"/>
  <circle cx="100" cy="102" r="76" fill="#000" opacity="0.14"/>
  <!-- lumpy head -->
  <path d="M100 34 q34 -4 48 22 q14 24 8 52 q12 4 6 16 q-6 10 -16 6 q-10 26 -46 28 q-36 -2 -46 -28 q-10 4 -16 -6 q-6 -12 6 -16 q-6 -28 8 -52 q14 -26 48 -22z" fill="#e8e4da" stroke="#20242e" stroke-width="4"/>
