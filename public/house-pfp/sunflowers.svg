<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Sunflower field">
  <defs>
    <linearGradient id="sf-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fbfe8"/><stop offset="1" stop-color="#d6ecc0"/></linearGradient>
    <linearGradient id="sf-field" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb84e"/><stop offset="1" stop-color="#5c7f30"/></linearGradient>
    <radialGradient id="sf-head" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7a4a22"/><stop offset="1" stop-color="#4f2f14"/></radialGradient>
    <g id="sf-petals" fill="#f6c033">
      <ellipse cx="0" cy="-16" rx="4.5" ry="10"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(45)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(90)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(135)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(180)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(225)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(270)"/>
      <ellipse cx="0" cy="-16" rx="4.5" ry="10" transform="rotate(315)"/>
    </g>
  </defs>
  <rect width="200" height="200" fill="url(#sf-sky)"/>
  <circle cx="158" cy="42" r="20" fill="#fff3c0" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.85"><ellipse cx="46" cy="38" rx="26" ry="8"/><ellipse cx="72" cy="32" rx="15" ry="5"/></g>
  <path d="M0 128 Q100 116 200 128 V200 H0 Z" fill="url(#sf-field)"/>
  <!-- background small flowers -->
  <g fill="#f4c430"><circle cx="40" cy="120" r="6"/><circle cx="90" cy="112" r="6"/><circle cx="150" cy="118" r="6"/><circle cx="120" cy="108" r="5"/></g>
  <g fill="#6b4526"><circle cx="40" cy="120" r="3"/><circle cx="90" cy="112" r="3"/><circle cx="150" cy="118" r="3"/><circle cx="120" cy="108" r="2.5"/></g>
  <!-- big foreground sunflowers -->
  <path d="M64 200 V150" stroke="#4f7a2c" stroke-width="4" stroke-linecap="round"/>
  <path d="M64 175 q-14 -6 -20 -16 M64 165 q14 -4 20 -12" stroke="#4f7a2c" stroke-width="3" fill="none"/>
  <use href="#sf-petals" transform="translate(64,142)"/>
  <circle cx="64" cy="142" r="11" fill="url(#sf-head)"/>
  <circle cx="64" cy="142" r="11" fill="none" stroke="#3a2410" stroke-width="1" stroke-dasharray="1.4 1.4"/>
  <path d="M138 200 V138" stroke="#4f7a2c" stroke-width="4" stroke-linecap="round"/>
  <path d="M138 172 q14 -6 20 -18 M138 160 q-14 -4 -20 -12" stroke="#4f7a2c" stroke-width="3" fill="none"/>
  <use href="#sf-petals" transform="translate(138,128) rotate(22)"/>
  <circle cx="138" cy="128" r="12" fill="url(#sf-head)"/>
  <circle cx="138" cy="128" r="12" fill="none" stroke="#3a2410" stroke-width="1" stroke-dasharray="1.4 1.4"/>
</svg>
