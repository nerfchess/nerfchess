    <radialGradient id="ts-moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7d6"/><stop offset="0.6" stop-color="#f4e6a8"/><stop offset="1" stop-color="#f4e6a8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="200" height="200" fill="url(#ts-sky)"/>
  <circle cx="48" cy="46" r="26" fill="url(#ts-moon)"/>
  <circle cx="48" cy="46" r="13" fill="#fff6d0"/>
  <circle cx="53" cy="43" r="11" fill="#26305e" opacity="0.5"/>
