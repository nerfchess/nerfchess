<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tralalero Tralala: the shark in sneakers, legs pumping at a full sprint. Loops like a GIF. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1.6; 0 0" dur="0.34s" repeatCount="indefinite"/>
    <!-- body -->
    <path d="M4 30 C14 18 42 16 56 26 C60 29 60 32 56 34.5 C44 41 16 41 4 30 Z" fill="#7d97ad" stroke="#33414e" stroke-width="2"/>
    <path d="M10 32 C24 37 42 36 52 31 C42 34 24 34.6 10 32 Z" fill="#dbe7f2"/>
    <!-- dorsal fin + tail -->
    <path d="M26 19 L34 8 L37 20 Z" fill="#61788c" stroke="#33414e" stroke-width="2"/>
    <path d="M4 30 L-2 22 L0 33 L-2 42 Z" fill="#61788c" stroke="#33414e" stroke-width="2"/>
    <!-- eye + gills + grin -->
    <circle cx="48" cy="26" r="1.8" fill="#141416"/>
    <path d="M40 24 L40 32 M36.5 24.5 L36.5 32.5 M33 25 L33 33" stroke="#33414e" stroke-width="1.2"/>
    <path d="M50 30 C52.5 30.4 54.5 30 56 29" fill="none" stroke="#33414e" stroke-width="1.4" stroke-linecap="round"/>
    <!-- running legs with sneakers -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-16 22 38; 18 22 38; -16 22 38" dur="0.34s" repeatCount="indefinite"/>
      <path d="M22 38 L18 50" stroke="#61788c" stroke-width="3.4" stroke-linecap="round"/>
      <g transform="translate(11 48)"><rect width="14" height="7" rx="3" fill="#f4f7f2" stroke="#c2403a" stroke-width="1.6"/><path d="M2 4.6 L9 2.4" stroke="#c2403a" stroke-width="1.4" stroke-linecap="round"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="18 36 39; -16 36 39; 18 36 39" dur="0.34s" repeatCount="indefinite"/>
      <path d="M36 39 L40 51" stroke="#61788c" stroke-width="3.4" stroke-linecap="round"/>
      <g transform="translate(35 49)"><rect width="14" height="7" rx="3" fill="#f4f7f2" stroke="#c2403a" stroke-width="1.6"/><path d="M2 4.6 L9 2.4" stroke="#c2403a" stroke-width="1.4" stroke-linecap="round"/></g>
    </g>
    <!-- speed lines -->
    <g stroke="#9fb7c9" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
      <path d="M2 24 L10 24 M0 30 L8 30 M2 36 L10 36">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.34s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
