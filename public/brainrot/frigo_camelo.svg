<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- Frigo Camelo: glossy camel with a refrigerator torso, door ajar and glowing cold. Loops like a GIF. -->
  <defs>
    <linearGradient id="friFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8bc7e"/>
      <stop offset="0.55" stop-color="#c99552"/>
      <stop offset="1" stop-color="#96662e"/>
    </linearGradient>
    <linearGradient id="friBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fb"/>
      <stop offset="0.55" stop-color="#d5e2ec"/>
      <stop offset="1" stop-color="#9fb4c6"/>
    </linearGradient>
    <linearGradient id="friDoor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4f9"/>
      <stop offset="1" stop-color="#b7c9d8"/>
    </linearGradient>
    <radialGradient id="friGlow" cx="0.3" cy="0.5" r="1">
      <stop offset="0" stop-color="#d6f4ff"/>
      <stop offset="0.6" stop-color="#8fd8f2"/>
      <stop offset="1" stop-color="#4fa8cc"/>
    </radialGradient>
    <radialGradient id="friIris" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="0.6" stop-color="#4f2c10"/>
      <stop offset="1" stop-color="#2c1607"/>
    </radialGradient>
    <radialGradient id="friSclera" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#d8d2c6"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="102" cy="248" rx="62" ry="9" fill="#101c22" opacity="0.22">
    <animate attributeName="rx" values="62;56;62" dur="1.3s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="1.3s" repeatCount="indefinite"/>

    <!-- camel legs -->
    <path d="M64 208 C62 222 62 232 58 240 M92 210 C92 224 92 234 90 242 M116 210 C116 224 116 234 118 242 M144 208 C146 222 146 232 150 240" stroke="#96662e" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M52 240 a6 6 0 0 0 12 0 Z M84 242 a6 6 0 0 0 12 0 Z M112 242 a6 6 0 0 0 12 0 Z M144 240 a6 6 0 0 0 12 0 Z" fill="#5e3c1a"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 160 172; 6 160 172; -8 160 172" dur="1.3s" repeatCount="indefinite"/>
      <path d="M160 172 C172 176 178 184 178 194" stroke="#96662e" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="179" cy="197" r="5" fill="#6e4a20"/>
    </g>

    <!-- the fridge torso (with a hump-shaped top: freezer bulge) -->
    <path d="M50 122 C56 100 84 92 104 96 C126 88 148 100 152 122 L152 204 C152 210 148 214 142 214 L58 214 C52 214 48 210 48 204 Z" fill="url(#friBox)" stroke="#6e8496" stroke-width="2"/>
    <!-- freezer divider -->
    <path d="M50 142 L152 142" stroke="#6e8496" stroke-width="2.4"/>
    <!-- closed freezer handle -->
    <rect x="60" y="128" width="26" height="6" rx="3" fill="#5a7080"/>
    <!-- core shadow + sheen on the box -->
    <path d="M142 104 C150 122 152 160 148 204 C156 162 156 122 146 102 Z" fill="#43596a" opacity="0.4"/>
    <rect x="58" y="150" width="11" height="54" rx="5.5" fill="#ffffff" opacity="0.35"/>

    <!-- cold interior revealed by the ajar door -->
    <path d="M96 148 L146 148 L146 208 L96 208 Z" fill="url(#friGlow)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <!-- shelves + a lonely bottle -->
    <path d="M98 168 h46 M98 188 h46" stroke="#e8fbff" stroke-width="2.6" opacity="0.8"/>
    <rect x="128" y="154" width="7" height="14" rx="2.5" fill="#7fc4e0"/>
    <rect x="104" y="174" width="10" height="13" rx="2" fill="#a8e0f2"/>

    <!-- the door, swung ajar (drawn as a skewed slab) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 96 178; -3 96 178; 0 96 178" dur="1.3s" repeatCount="indefinite"/>
      <path d="M96 148 L66 158 L66 224 L96 208 Z" fill="url(#friDoor)" stroke="#6e8496" stroke-width="2"/>
      <rect x="72" y="170" width="5" height="26" rx="2.5" fill="#5a7080"/>
      <path d="M70 160 L70 220" stroke="#ffffff" stroke-width="2.4" opacity="0.6"/>
    </g>

    <!-- cold fog spilling out -->
    <g fill="#dff6ff">
      <ellipse cx="86" cy="216" rx="12" ry="5">
        <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.3s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="106" cy="224" rx="9" ry="4">
        <animate attributeName="opacity" values="0.2;0.75;0.2" dur="1.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <!-- snowflake sticker -->
    <g stroke="#5aa8cc" stroke-width="2.2" stroke-linecap="round">
      <path d="M124 118 v14 M117 121.5 l14 7 M131 121.5 l-14 7"/>
    </g>

    <!-- camel neck + head, rising from the fridge top -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 96 96; 2.5 96 96; -2 96 96" dur="1.3s" repeatCount="indefinite"/>
      <path d="M84 100 C76 76 76 52 88 38 L110 44 C104 62 106 84 112 100 Z" fill="url(#friFur)"/>
      <path d="M108 46 C104 64 106 84 111 98" stroke="#7a5222" stroke-width="3" fill="none" opacity="0.4"/>
      <!-- ears -->
      <path d="M74 26 C68 20 62 19 57 22 C61 29 68 32 74 31 Z" fill="url(#friFur)" stroke="#8a5c28" stroke-width="1.4"/>
      <path d="M112 22 C117 15 124 13 129 16 C126 24 119 28 113 28 Z" fill="url(#friFur)" stroke="#8a5c28" stroke-width="1.4"/>
      <!-- head -->
      <path d="M60 32 C66 16 96 10 112 20 C126 28 128 44 118 54 C104 64 70 60 62 48 C58 42 58 36 60 32 Z" fill="url(#friFur)"/>
      <!-- fur tuft -->
      <path d="M82 12 C86 6 94 4 100 7 C96 11 88 13 82 12 Z" fill="#a8783c"/>
      <!-- rim light + core shadow on the head -->
      <path d="M64 34 C68 24 80 17 92 15" stroke="#f5dcb4" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
      <path d="M116 26 C124 34 124 46 116 52 C122 44 122 32 112 24 Z" fill="#6e4a1e" opacity="0.45"/>
      <!-- droopy glossy eyes -->
      <path d="M66 28 Q74 24 82 27" stroke="#5e3c1a" stroke-width="4.4" stroke-linecap="round" fill="none"/>
      <path d="M96 25 Q104 21 112 25" stroke="#5e3c1a" stroke-width="4.4" stroke-linecap="round" fill="none"/>
      <ellipse cx="75" cy="36" rx="10" ry="11" fill="url(#friSclera)"/>
      <circle cx="77" cy="38" r="6.4" fill="url(#friIris)"/>
      <circle cx="77" cy="38" r="2.9" fill="#1d1008"/>
      <circle cx="74.6" cy="35.4" r="2.2" fill="#ffffff"/>
      <circle cx="79.4" cy="40" r="1.1" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="103" cy="35" rx="10" ry="11" fill="url(#friSclera)"/>
      <circle cx="101" cy="37" r="6.4" fill="url(#friIris)"/>
      <circle cx="101" cy="37" r="2.9" fill="#1d1008"/>
      <circle cx="98.6" cy="34.4" r="2.2" fill="#ffffff"/>
      <circle cx="103.4" cy="39" r="1.1" fill="#ffffff" opacity="0.9"/>
      <!-- muzzle: smug camel lips -->
      <path d="M110 40 C122 38 130 42 132 50 C130 58 118 60 110 56 C106 52 106 44 110 40 Z" fill="#dcae74"/>
      <ellipse cx="126" cy="46" rx="2.4" ry="3" fill="#7a5222"/>
      <path d="M112 55 Q120 60 129 55" stroke="#7a5222" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- breath puff of cold -->
      <ellipse cx="140" cy="52" rx="6" ry="3.4" fill="#dff6ff">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
