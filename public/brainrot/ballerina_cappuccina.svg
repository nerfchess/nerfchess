<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- Ballerina Cappuccina: glossy coffee-cup-headed ballerina mid-pirouette, en pointe. Loops like a GIF. -->
  <defs>
    <linearGradient id="balCup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b07c50"/>
      <stop offset="0.55" stop-color="#82522e"/>
      <stop offset="1" stop-color="#523016"/>
    </linearGradient>
    <linearGradient id="balFoam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="1" stop-color="#e2cba4"/>
    </linearGradient>
    <linearGradient id="balSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5cfa4"/>
      <stop offset="1" stop-color="#d3a06e"/>
    </linearGradient>
    <linearGradient id="balTutu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9e4"/>
      <stop offset="0.55" stop-color="#f5a8c0"/>
      <stop offset="1" stop-color="#d97396"/>
    </linearGradient>
    <linearGradient id="balBodice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b8cc"/>
      <stop offset="1" stop-color="#c96a8e"/>
    </linearGradient>
    <radialGradient id="balIris" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="0.6" stop-color="#4f2c10"/>
      <stop offset="1" stop-color="#2c1607"/>
    </radialGradient>
    <radialGradient id="balSclera" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#d8d2c6"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, tight under the pointe -->
  <ellipse cx="100" cy="248" rx="34" ry="7" fill="#1a120f" opacity="0.22">
    <animate attributeName="rx" values="34;28;34" dur="1.4s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.4s" repeatCount="indefinite"/>

    <!-- pirouette sway of the whole dancer -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 100 200; 3 100 200; -3 100 200" dur="1.4s" repeatCount="indefinite"/>

      <!-- arms: one curved overhead, one out (port de bras) -->
      <path d="M84 132 C64 122 50 104 48 84" stroke="url(#balSkin)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M116 132 C138 124 154 128 166 140" stroke="url(#balSkin)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="48" cy="82" r="6.5" fill="#f5cfa4"/>
      <circle cx="168" cy="141" r="6.5" fill="#f5cfa4"/>

      <!-- bodice -->
      <path d="M84 126 C94 120 106 120 116 126 L112 162 L88 162 Z" fill="url(#balBodice)"/>
      <path d="M88 130 C96 126 104 126 112 130" stroke="#ffe2ec" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.8"/>

      <!-- tutu: layered frill -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="1.6 100 166; -1.6 100 166; 1.6 100 166" dur="1.4s" repeatCount="indefinite"/>
        <path d="M52 162 C68 154 132 154 148 162 C150 172 136 180 100 180 C64 180 50 172 52 162 Z" fill="url(#balTutu)"/>
        <path d="M56 166 Q64 176 74 168 Q82 178 94 170 Q102 180 112 170 Q122 178 130 168 Q140 176 146 165" stroke="#c05a80" stroke-width="2.4" fill="none" opacity="0.55"/>
        <path d="M58 160 C74 154 126 154 142 160" stroke="#ffe9f1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
      </g>

      <!-- legs: standing leg en pointe, working leg in passé -->
      <path d="M100 178 C100 200 100 222 100 238" stroke="url(#balSkin)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <path d="M96 180 C86 192 88 200 98 206" stroke="url(#balSkin)" stroke-width="9" stroke-linecap="round" fill="none"/>
      <!-- pointe shoes -->
      <path d="M95 236 C95 230 105 230 105 236 L104 248 C104 252 96 252 96 248 Z" fill="#e88aa8"/>
      <path d="M96 240 L92 234 M104 240 L108 234" stroke="#d9739b" stroke-width="2" stroke-linecap="round"/>
      <path d="M94 204 C100 200 106 202 108 208 C104 212 96 212 94 208 Z" fill="#e88aa8"/>

      <!-- neck -->
      <rect x="96" y="112" width="8" height="14" rx="4" fill="url(#balSkin)"/>

      <!-- the cup head -->
      <path d="M60 52 C60 47 140 47 140 52 L134 104 C132 116 68 116 66 104 Z" fill="url(#balCup)"/>
      <path d="M140 62 C158 61 164 73 159 84 C155 93 144 97 137 94" fill="none" stroke="#5f3a1e" stroke-width="8" stroke-linecap="round"/>
      <path d="M58 54 C58 46 142 46 142 54 C142 60 58 60 58 54 Z" fill="#8a5a32"/>
      <!-- foam swirl on top -->
      <path d="M64 50 C64 34 80 24 100 24 C120 24 136 34 136 50 C120 56 80 56 64 50 Z" fill="url(#balFoam)"/>
      <path d="M78 40 C84 32 98 30 108 34 C116 37 120 44 114 48 C108 52 98 50 96 44 C95 40 100 37 104 40" stroke="#d9b98a" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- cup shading -->
      <path d="M128 58 C132 74 131 92 127 104 C134 92 136 72 132 58 Z" fill="#38200e" opacity="0.4"/>
      <path d="M68 62 C66 76 67 92 70 102" stroke="#dcab7c" stroke-width="3.6" stroke-linecap="round" fill="none" opacity="0.55"/>
      <rect x="73" y="62" width="10" height="42" rx="5" fill="#ffffff" opacity="0.17"/>

      <!-- lashes + big glossy eyes on the cup -->
      <path d="M70 68 Q80 63 90 67" stroke="#33200f" stroke-width="4.6" stroke-linecap="round" fill="none"/>
      <path d="M110 67 Q120 63 130 68" stroke="#33200f" stroke-width="4.6" stroke-linecap="round" fill="none"/>
      <ellipse cx="82" cy="80" rx="11.5" ry="12.5" fill="url(#balSclera)"/>
      <circle cx="84" cy="82" r="7" fill="url(#balIris)"/>
      <circle cx="84" cy="82" r="3.2" fill="#1d1008"/>
      <circle cx="81.4" cy="79.2" r="2.5" fill="#ffffff"/>
      <circle cx="86.8" cy="84.4" r="1.3" fill="#ffffff" opacity="0.9"/>
      <ellipse cx="118" cy="80" rx="11.5" ry="12.5" fill="url(#balSclera)"/>
      <circle cx="116" cy="82" r="7" fill="url(#balIris)"/>
      <circle cx="116" cy="82" r="3.2" fill="#1d1008"/>
      <circle cx="113.4" cy="79.2" r="2.5" fill="#ffffff"/>
      <circle cx="118.8" cy="84.4" r="1.3" fill="#ffffff" opacity="0.9"/>
      <!-- blush + serene smile -->
      <ellipse cx="70" cy="92" rx="4.6" ry="3" fill="#e8909c" opacity="0.6"/>
      <ellipse cx="130" cy="92" rx="4.6" ry="3" fill="#e8909c" opacity="0.6"/>
      <path d="M92 98 Q100 104 108 98" stroke="#33200f" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    </g>

    <!-- sparkle trail of the turn -->
    <g fill="#ffd9e4">
      <path d="M38 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 Z" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.1;0.9" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M164 108 l1.6 4 4 1.6 -4 1.6 -1.6 4 -1.6 -4 -4 -1.6 4 -1.6 Z" opacity="0.35">
        <animate attributeName="opacity" values="0.3;0.95;0.3" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
