<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- Cappuccino Assassino: glossy espresso-cup ninja, foam head, twin blades ready. Loops like a GIF. -->
  <defs>
    <linearGradient id="capCup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8734a"/>
      <stop offset="0.55" stop-color="#7d4e2c"/>
      <stop offset="1" stop-color="#4e2d15"/>
    </linearGradient>
    <linearGradient id="capFoam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ec"/>
      <stop offset="0.7" stop-color="#f2e3c8"/>
      <stop offset="1" stop-color="#d9c19c"/>
    </linearGradient>
    <linearGradient id="capBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="0.5" stop-color="#c2d2e0"/>
      <stop offset="1" stop-color="#8aa2b8"/>
    </linearGradient>
    <linearGradient id="capBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4656"/>
      <stop offset="1" stop-color="#1c222e"/>
    </linearGradient>
    <radialGradient id="capIris" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="0.6" stop-color="#4f2c10"/>
      <stop offset="1" stop-color="#2c1607"/>
    </radialGradient>
    <radialGradient id="capSclera" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#d8d2c6"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="246" rx="56" ry="9" fill="#1a120a" opacity="0.22">
    <animate attributeName="rx" values="56;50;56" dur="0.9s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.9s" repeatCount="indefinite"/>

    <!-- twin blades, crossed low behind the cup -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 100 170; 3 100 170; -4 100 170" dur="0.9s" repeatCount="indefinite"/>
      <g transform="rotate(38 52 168)">
        <rect x="14" y="164" width="76" height="9" rx="4.5" fill="url(#capBlade)" stroke="#6e8296" stroke-width="1.4"/>
        <path d="M16 166 L84 166" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
        <rect x="86" y="160" width="7" height="17" rx="2.5" fill="#3d2413"/>
        <rect x="93" y="163" width="22" height="11" rx="5" fill="#5a3520"/>
        <path d="M96 166 h16 M96 170 h16" stroke="#2e1a0c" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <g transform="translate(200 0) scale(-1 1)">
        <g transform="translate(0 30)"><g transform="rotate(38 52 168)">
          <rect x="14" y="164" width="76" height="9" rx="4.5" fill="url(#capBlade)" stroke="#6e8296" stroke-width="1.4"/>
          <path d="M16 166 L84 166" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
          <rect x="86" y="160" width="7" height="17" rx="2.5" fill="#3d2413"/>
          <rect x="93" y="163" width="22" height="11" rx="5" fill="#5a3520"/>
          <path d="M96 166 h16 M96 170 h16" stroke="#2e1a0c" stroke-width="1.6" stroke-linecap="round"/>
        </g></g>
      </g>
    </g>

    <!-- stubby legs -->
    <path d="M78 216 C76 228 74 234 68 238 M122 216 C124 228 126 234 132 238" stroke="#4e2d15" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="66" cy="240" rx="11" ry="6" fill="#2e1a0c"/>
    <ellipse cx="134" cy="240" rx="11" ry="6" fill="#2e1a0c"/>

    <!-- cup body -->
    <path d="M52 98 C52 92 148 92 148 98 L140 200 C138 216 62 216 60 200 Z" fill="url(#capCup)"/>
    <!-- cup handle -->
    <path d="M148 118 C170 116 178 132 172 148 C168 160 154 166 144 162" fill="none" stroke="#5f3a1e" stroke-width="10" stroke-linecap="round"/>
    <path d="M150 122 C166 121 172 133 168 144" fill="none" stroke="#c08a5a" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- saucer lip -->
    <path d="M50 100 C50 90 150 90 150 100 C150 108 50 108 50 100 Z" fill="#8a5a32"/>
    <!-- core shadow + rim light + sheen -->
    <path d="M132 100 C140 132 138 172 130 198 C142 176 146 130 138 100 Z" fill="#331d0d" opacity="0.4"/>
    <path d="M62 112 C58 140 60 172 66 194" stroke="#d9a878" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.55"/>
    <rect x="68" y="112" width="13" height="84" rx="6.5" fill="#ffffff" opacity="0.17"/>

    <!-- foam head rising out of the cup -->
    <path d="M58 96 C56 68 76 52 100 52 C124 52 144 68 142 96 C130 102 70 102 58 96 Z" fill="url(#capFoam)"/>
    <path d="M62 88 C64 74 76 62 92 58 M136 90 C136 78 128 66 116 60" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- foam bubbles -->
    <circle cx="70" cy="64" r="5" fill="#fff8ec"/>
    <circle cx="132" cy="66" r="4" fill="#fff8ec"/>
    <circle cx="122" cy="52" r="3" fill="#f2e3c8"/>

    <!-- ninja headband over the foam -->
    <path d="M58 78 C80 70 120 70 142 78 L142 90 C120 82 80 82 58 90 Z" fill="url(#capBand)"/>
    <path d="M60 80 C82 73 118 73 140 80" stroke="#5c6a80" stroke-width="2.4" fill="none" opacity="0.7"/>
    <!-- headband tails, fluttering -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 142 84; 8 142 84; -6 142 84" dur="0.9s" repeatCount="indefinite"/>
      <path d="M142 80 C160 78 172 84 182 96 C170 94 158 94 148 90 Z" fill="url(#capBand)"/>
      <path d="M142 84 C158 88 166 98 170 110 C160 104 150 98 144 92 Z" fill="url(#capBand)"/>
    </g>

    <!-- steam wisps -->
    <g stroke="#e8d9c2" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8">
      <path d="M84 44 C80 36 84 28 80 20">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M112 42 C116 34 112 26 116 18">
        <animate attributeName="opacity" values="0.25;0.85;0.25" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- big glossy eyes on the cup, narrowed by the band -->
    <path d="M64 118 Q78 111 90 117" stroke="#33200f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M110 117 Q124 111 138 118" stroke="#33200f" stroke-width="6" stroke-linecap="round" fill="none"/>
    <ellipse cx="78" cy="132" rx="13" ry="14" fill="url(#capSclera)"/>
    <circle cx="80" cy="134" r="8" fill="url(#capIris)"/>
    <circle cx="80" cy="134" r="3.6" fill="#1d1008"/>
    <circle cx="77" cy="130.8" r="2.8" fill="#ffffff"/>
    <circle cx="83.2" cy="136.6" r="1.4" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="124" cy="132" rx="13" ry="14" fill="url(#capSclera)"/>
    <circle cx="122" cy="134" r="8" fill="url(#capIris)"/>
    <circle cx="122" cy="134" r="3.6" fill="#1d1008"/>
    <circle cx="119" cy="130.8" r="2.8" fill="#ffffff"/>
    <circle cx="125.2" cy="136.6" r="1.4" fill="#ffffff" opacity="0.9"/>

    <!-- determined little mouth -->
    <path d="M92 156 Q101 162 110 156" stroke="#33200f" stroke-width="4.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
