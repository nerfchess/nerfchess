<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <!-- Chimpanzini Bananini: glossy green chimp snug in his banana, peel fronds waving. Loops like a GIF. -->
  <defs>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.55" stop-color="#f5c343"/>
      <stop offset="1" stop-color="#cf9a22"/>
    </linearGradient>
    <linearGradient id="peelIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf0c0"/>
      <stop offset="1" stop-color="#ecd07e"/>
    </linearGradient>
    <linearGradient id="chimpG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ecb5a"/>
      <stop offset="0.55" stop-color="#6fa23a"/>
      <stop offset="1" stop-color="#487224"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecb2"/>
      <stop offset="1" stop-color="#b2cc7e"/>
    </linearGradient>
    <radialGradient id="chIris" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset="0.6" stop-color="#4f2c10"/>
      <stop offset="1" stop-color="#2c1607"/>
    </radialGradient>
    <radialGradient id="chSclera" cx="0.4" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#d9d2c6"/>
    </radialGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="246" rx="58" ry="10" fill="#2a2206" opacity="0.22">
    <animate attributeName="rx" values="58;51;58" dur="0.9s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="0.9s" repeatCount="indefinite"/>

    <!-- back peel fronds: wave -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 100 172; 5 100 172; -7 100 172" dur="0.9s" repeatCount="indefinite"/>
      <path d="M96 176 C64 168 40 142 34 106 C54 108 80 128 92 158 Z" fill="url(#peel)"/>
      <path d="M42 112 C58 120 76 138 86 158" stroke="#fff3c2" stroke-width="3.4" fill="none" opacity="0.6" stroke-linecap="round"/>
      <ellipse cx="36" cy="106" rx="4.6" ry="3.6" fill="#8a6414"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="7 100 172; -5 100 172; 7 100 172" dur="0.9s" repeatCount="indefinite"/>
      <path d="M104 176 C136 168 160 142 166 106 C146 108 120 128 108 158 Z" fill="url(#peel)"/>
      <path d="M158 112 C142 120 124 138 114 158" stroke="#fff3c2" stroke-width="3.4" fill="none" opacity="0.6" stroke-linecap="round"/>
      <ellipse cx="164" cy="106" rx="4.6" ry="3.6" fill="#8a6414"/>
    </g>

    <!-- chimp shoulders filling the cup -->
    <ellipse cx="100" cy="156" rx="36" ry="26" fill="url(#chimpG)"/>

    <!-- chimp head (green) -->
    <g>
      <!-- ears -->
      <circle cx="55" cy="102" r="14" fill="url(#chimpG)"/>
      <circle cx="57" cy="103" r="7.5" fill="#b2cc7e"/>
      <circle cx="145" cy="102" r="14" fill="url(#chimpG)"/>
      <circle cx="143" cy="103" r="7.5" fill="#b2cc7e"/>
      <!-- head -->
      <circle cx="100" cy="100" r="44" fill="url(#chimpG)"/>
      <path d="M126 70 C142 84 146 110 134 128 C144 110 142 84 126 70 Z" fill="#33511a" opacity="0.45"/>
      <path d="M68 74 C76 64 88 58 100 57" stroke="#d9ecae" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.65"/>
      <ellipse cx="82" cy="86" rx="7" ry="16" fill="#ffffff" opacity="0.18" transform="rotate(-16 82 86)"/>
      <!-- muzzle -->
      <path d="M70 104 C70 88 82 80 100 80 C118 80 130 88 130 104 C130 122 118 132 100 132 C82 132 70 122 70 104 Z" fill="url(#muzzle)"/>
      <!-- eyebrows -->
      <path d="M70 76 Q83 69 95 75" stroke="#2f4a16" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M105 75 Q117 69 130 76" stroke="#2f4a16" stroke-width="7" stroke-linecap="round" fill="none"/>
      <!-- glossy eyes with cheeky blink -->
      <g>
        <ellipse cx="84" cy="94" rx="12" ry="13" fill="url(#chSclera)"/>
        <circle cx="85.5" cy="96" r="7.4" fill="url(#chIris)"/>
        <circle cx="85.5" cy="96" r="3.3" fill="#1d1008"/>
        <circle cx="82.8" cy="93" r="2.6" fill="#ffffff"/>
        <circle cx="88.4" cy="98.6" r="1.3" fill="#ffffff" opacity="0.9"/>
        <ellipse cx="116" cy="94" rx="12" ry="13" fill="url(#chSclera)"/>
        <circle cx="114.5" cy="96" r="7.4" fill="url(#chIris)"/>
        <circle cx="114.5" cy="96" r="3.3" fill="#1d1008"/>
        <circle cx="111.8" cy="93" r="2.6" fill="#ffffff"/>
        <circle cx="117.4" cy="98.6" r="1.3" fill="#ffffff" opacity="0.9"/>
        <rect x="68" y="78" width="64" height="30" rx="13" fill="#6fa23a" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.82;0.87;0.92;1" dur="3.2s" repeatCount="indefinite"/>
        </rect>
      </g>
      <!-- nostrils + big smile -->
      <ellipse cx="93" cy="109" rx="2.6" ry="3.4" fill="#4a6a2a"/>
      <ellipse cx="107" cy="109" rx="2.6" ry="3.4" fill="#4a6a2a"/>
      <path d="M82 116 C88 126 112 126 118 116 C116 128 108 133 100 133 C92 133 84 128 82 116 Z" fill="#5c3a20"/>
      <path d="M86 118 C92 122 108 122 114 118 L113 121 L87 121 Z" fill="#ffffff"/>
      <ellipse cx="70" cy="110" rx="6.4" ry="4.4" fill="#e2905c" opacity="0.4"/>
      <ellipse cx="130" cy="110" rx="6.4" ry="4.4" fill="#e2905c" opacity="0.4"/>
    </g>

    <!-- banana cup in front -->
    <path d="M40 158 C48 200 152 200 160 158 C150 174 50 174 40 158 Z" fill="url(#peel)"/>
    <path d="M42 162 C54 176 146 176 158 162 C154 196 132 212 100 212 C68 212 46 196 42 162 Z" fill="url(#peel)"/>
    <path d="M46 166 C60 178 140 178 154 166 C148 192 128 205 100 205 C72 205 52 192 46 166 Z" fill="url(#peelIn)" opacity="0.55"/>
    <path d="M126 202 C142 194 152 180 156 164 C154 190 138 206 118 210 Z" fill="#a87a18" opacity="0.4"/>
    <path d="M52 170 C56 184 68 196 82 201" stroke="#fff3c2" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round"/>
    <rect x="66" y="172" width="11" height="26" rx="5.5" fill="#ffffff" opacity="0.2"/>
  </g>
</svg>
