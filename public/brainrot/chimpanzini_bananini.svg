<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chimpanzini Bananini: the monkey snug in its banana, peel fronds waving. Loops like a GIF. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2; 0 0" dur="0.7s" repeatCount="indefinite"/>
    <!-- back peel frond -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 32 44; 6 32 44; -8 32 44" dur="0.7s" repeatCount="indefinite"/>
      <path d="M32 46 C20 44 12 36 10 24 C16 24 24 28 28 36 Z" fill="#f2c94c" stroke="#8a6414" stroke-width="1.8"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="8 32 44; -6 32 44; 8 32 44" dur="0.7s" repeatCount="indefinite"/>
      <path d="M32 46 C44 44 52 36 54 24 C48 24 40 28 36 36 Z" fill="#f2c94c" stroke="#8a6414" stroke-width="1.8"/>
    </g>
    <!-- banana cup -->
    <path d="M18 42 C22 52 42 52 46 42 C42 46 22 46 18 42 Z" fill="#e6b93c" stroke="#8a6414" stroke-width="1.8"/>
    <path d="M18 42 C20 48 44 48 46 42 L44 50 C40 55 24 55 20 50 Z" fill="#f6da7a" stroke="#8a6414" stroke-width="1.8"/>
    <!-- monkey -->
    <circle cx="32" cy="30" r="11" fill="#6b4a34" stroke="#33210f" stroke-width="2"/>
    <path d="M21 28 a4 4 0 1 0 0.1 0 M43 28 a4 4 0 1 0 -0.1 0" fill="#6b4a34" stroke="#33210f" stroke-width="1.6"/>
    <path d="M24 31 C24 24 27 21 32 21 C37 21 40 24 40 31 C40 36 37 39 32 39 C27 39 24 36 24 31 Z" fill="#caa580"/>
    <!-- eyes: cheeky blink -->
    <g>
      <circle cx="28.5" cy="29" r="1.5" fill="#141416"/>
      <circle cx="35.5" cy="29" r="1.5" fill="#141416"/>
      <rect x="25" y="27.4" width="14" height="3.2" fill="#caa580" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.82;0.87;0.92;1" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <path d="M28 34.5 C30 36.8 34 36.8 36 34.5" fill="none" stroke="#33210f" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
