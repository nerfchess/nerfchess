<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tung Tung Tung Sahur: the wooden log-man, bat mid-swing, bouncing to his own drumbeat. Loops like a GIF. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.4; 0 0" dur="0.5s" repeatCount="indefinite"/>
    <!-- legs -->
    <path d="M26 54 L26 60 L22 60 M38 54 L38 60 L42 60" fill="none" stroke="#4a2b10" stroke-width="3" stroke-linecap="round"/>
    <!-- log body -->
    <rect x="20" y="14" width="24" height="42" rx="10" fill="#8a5a2c" stroke="#4a2b10" stroke-width="2"/>
    <ellipse cx="32" cy="15.5" rx="12" ry="4.5" fill="#caa580" stroke="#4a2b10" stroke-width="1.6"/>
    <path d="M26 15.5a6 2.4 0 0 0 12 0" fill="none" stroke="#8a5a2c" stroke-width="1"/>
    <!-- wood grain -->
    <path d="M23 30 C28 32 36 32 41 30 M23 42 C28 44 36 44 41 42" fill="none" stroke="#5c3714" stroke-width="1.2"/>
    <!-- face -->
    <circle cx="27.5" cy="26" r="3.4" fill="#f4f7f2" stroke="#2b1c10" stroke-width="1.1"/>
    <circle cx="36.5" cy="26" r="3.4" fill="#f4f7f2" stroke="#2b1c10" stroke-width="1.1"/>
    <circle cx="27.9" cy="26.6" r="1.3" fill="#141416"/>
    <circle cx="36.1" cy="26.6" r="1.3" fill="#141416"/>
    <path d="M28 35 C30 37.4 34 37.4 36 35" fill="none" stroke="#2b1c10" stroke-width="1.4" stroke-linecap="round"/>
    <!-- left arm -->
    <path d="M20 34 C15 35 13 38 12.5 42" fill="none" stroke="#4a2b10" stroke-width="3" stroke-linecap="round"/>
    <!-- bat arm: swings -->
    <g stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-24 44 32; 14 44 32; -24 44 32" dur="0.5s" repeatCount="indefinite"/>
      <path d="M44 32 C48 30 50 27 51 24" fill="none" stroke="#4a2b10" stroke-width="3"/>
      <path d="M51 24 L58 8" stroke="#b98a4e" stroke-width="5"/>
      <path d="M51 24 L58 8" stroke="#4a2b10" stroke-width="5" fill="none" opacity="0.25"/>
    </g>
  </g>
</svg>
