<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Danielle">
  <defs>
    <linearGradient id="da-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3dd"/>
      <stop offset="0.6" stop-color="#fbe3bd"/>
      <stop offset="1" stop-color="#f6cf9d"/>
    </linearGradient>
    <linearGradient id="da-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a4b2c"/>
      <stop offset="0.5" stop-color="#5f3820"/>
      <stop offset="1" stop-color="#4a2a17"/>
    </linearGradient>
    <radialGradient id="da-sun" cx="0.5" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#fff6db" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffe9b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- golden-hour window backlight -->
  <rect width="200" height="200" fill="url(#da-bg)"/>
  <rect x="8" y="8" width="80" height="120" rx="6" fill="#fff8e6" opacity="0.85"/>
  <rect x="112" y="8" width="80" height="120" rx="6" fill="#fff4d8" opacity="0.8"/>
  <path d="M48 8 V128 M152 8 V128" stroke="#eed3a2" stroke-width="3" opacity="0.8"/>
  <rect width="200" height="200" fill="url(#da-sun)"/>
  <g stroke="#ffdf9e" stroke-width="5" opacity="0.5" stroke-linecap="round">
    <path d="M30 6 L12 40 M172 4 L188 36"/>
  </g>

  <!-- wavy hair: back volume -->
  <path d="M52 62 Q46 24 100 22 Q154 24 148 62 Q158 96 152 132 Q160 164 146 192 Q136 200 128 194 Q140 160 132 128 Q142 96 136 70 L64 70 Q58 96 68 128 Q60 160 72 194 Q64 200 54 192 Q40 164 48 132 Q42 96 52 62 Z" fill="url(#da-hair)"/>

  <!-- shoulders: white tee with pup print hint -->
  <path d="M36 200 Q44 154 78 144 L100 138 L122 144 Q156 154 164 200 Z" fill="#fdfbf6"/>
  <path d="M84 145 Q100 158 116 145 L110 140 H90 Z" fill="#e9e2d2"/>
  <path d="M88 168 Q100 160 112 168 Q112 182 100 186 Q88 182 88 168 Z" fill="#e8c27a" opacity="0.9"/>
  <circle cx="95" cy="170" r="1.6" fill="#5f3820"/>
  <circle cx="105" cy="170" r="1.6" fill="#5f3820"/>
  <path d="M97 176 Q100 179 103 176" stroke="#5f3820" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <path d="M90 164 L86 158 M110 164 L114 158" stroke="#c4964e" stroke-width="3" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M89 118 H111 V142 Q100 150 89 142 Z" fill="#fbe4d2"/>
  <path d="M89 122 Q100 130 111 122 V118 H89 Z" fill="#efc9b2"/>

  <!-- face: warm, soft smile -->
  <path d="M64 78 Q64 42 100 42 Q136 42 136 78 Q136 104 124 116 Q112 126 100 126 Q88 126 76 116 Q64 104 64 78 Z" fill="#fdeee0"/>
  <path d="M136 82 Q132 108 118 118 Q128 106 130 82 Z" fill="#f2d4bd" opacity="0.8"/>

  <!-- wavy front strands -->
  <path d="M100 32 Q62 34 60 78 Q54 92 60 108 Q52 126 60 146 Q66 160 62 178 Q70 184 76 180 Q72 156 78 136 Q70 116 78 98 Q74 72 92 54 L100 44 Z" fill="url(#da-hair)"/>
  <path d="M100 32 Q138 34 140 78 Q146 92 140 108 Q148 126 140 146 Q134 160 138 178 Q130 184 124 180 Q128 156 122 136 Q130 116 122 98 Q126 72 108 54 L100 44 Z" fill="url(#da-hair)"/>
  <g stroke="#96612f" stroke-width="2.2" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M66 84 Q60 100 66 116 Q58 134 66 152"/>
    <path d="M134 84 Q140 100 134 116 Q142 134 134 152"/>
    <path d="M74 62 Q68 78 72 92"/>
    <path d="M126 62 Q132 78 128 92"/>
  </g>

  <!-- big warm eyes -->
  <g>
    <ellipse cx="85" cy="85" rx="8" ry="8.8" fill="#3a2416"/>
    <ellipse cx="115" cy="85" rx="8" ry="8.8" fill="#3a2416"/>
    <circle cx="88" cy="81.5" r="2.8" fill="#fff"/>
    <circle cx="118" cy="81.5" r="2.8" fill="#fff"/>
    <circle cx="82.5" cy="88.5" r="1.4" fill="#d99a5b" opacity="0.9"/>
    <circle cx="112.5" cy="88.5" r="1.4" fill="#d99a5b" opacity="0.9"/>
    <path d="M76 78 Q85 73 94 78" stroke="#2e1c10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M106 78 Q115 73 124 78" stroke="#2e1c10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M77 69 Q85 66 93 68" stroke="#4e321e" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M107 68 Q115 66 123 69" stroke="#4e321e" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9"/>

  <!-- rosy blush + nose + smile -->
  <ellipse cx="77" cy="99" rx="7.5" ry="4" fill="#f6b1a0" opacity="0.65"/>
  <ellipse cx="123" cy="99" rx="7.5" ry="4" fill="#f6b1a0" opacity="0.65"/>
  <path d="M99 95 Q97 100 100 102" stroke="#e3b294" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M91 109 Q100 117 109 109 Q105 118 100 118 Q95 118 91 109 Z" fill="#ee8f87"/>
  <path d="M93 109 Q100 114 107 109" stroke="#c96b62" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- sun glimmer on hair -->
  <path d="M66 56 Q76 42 94 38" stroke="#c98d4b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M134 56 Q124 42 106 38" stroke="#c98d4b" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
