<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Minji">
  <defs>
    <linearGradient id="mi-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cabcae"/>
      <stop offset="1" stop-color="#a89482"/>
    </linearGradient>
    <linearGradient id="mi-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262e"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="mi-hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5666"/>
      <stop offset="1" stop-color="#39414f"/>
    </linearGradient>
  </defs>

  <!-- backstage: brick + drape -->
  <rect width="200" height="200" fill="url(#mi-bg)"/>
  <g fill="#b39c85" opacity="0.85">
    <rect x="4" y="10" width="30" height="12" rx="1.5"/>
    <rect x="38" y="10" width="30" height="12" rx="1.5"/>
    <rect x="20" y="26" width="30" height="12" rx="1.5"/>
    <rect x="4" y="42" width="30" height="12" rx="1.5"/>
    <rect x="38" y="42" width="30" height="12" rx="1.5"/>
    <rect x="20" y="58" width="30" height="12" rx="1.5"/>
  </g>
  <path d="M140 0 Q150 60 142 120 Q158 60 152 0 Z M168 0 Q178 70 170 140 Q186 70 180 0 Z" fill="#8e7c6b" opacity="0.7"/>
  <rect x="140" y="150" width="52" height="36" rx="3" fill="#b08d5f" opacity="0.9"/>
  <path d="M140 158 h52 M148 150 v36" stroke="#8f6f47" stroke-width="2" opacity="0.8"/>

  <!-- braids behind shoulders -->
  <g fill="url(#mi-hair)">
    <path d="M58 96 Q50 130 56 168 Q60 186 68 196 L78 190 Q68 172 68 150 Q66 120 70 98 Z"/>
    <path d="M142 96 Q150 130 144 168 Q140 186 132 196 L122 190 Q132 172 132 150 Q134 120 130 98 Z"/>
  </g>
  <g stroke="#3a4048" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M60 118 q8 4 12 0 M58 136 q8 4 12 0 M58 154 q8 4 12 0 M60 172 q8 4 12 0"/>
    <path d="M128 118 q8 4 12 0 M130 136 q8 4 12 0 M130 154 q8 4 12 0 M128 172 q8 4 12 0"/>
  </g>
  <path d="M62 182 l10 6 M138 182 l-10 6" stroke="#7fae8e" stroke-width="3" stroke-linecap="round"/>

  <!-- white jersey with navy trim + number -->
  <path d="M34 200 Q42 152 78 142 L100 136 L122 142 Q158 152 166 200 Z" fill="#f8f8f4"/>
  <path d="M82 142 L100 156 L118 142 L112 138 H88 Z" fill="#2c3a5e"/>
  <path d="M84 144 L100 158 L116 144" stroke="#2c3a5e" stroke-width="3" fill="none"/>
  <path d="M78 178 h14 v16 h-14 Z M108 178 h14 v16 h-14 Z" fill="#2c3a5e" opacity="0.9"/>
  <path d="M42 176 Q40 188 42 200 M158 176 Q160 188 158 200" stroke="#2c3a5e" stroke-width="4" fill="none" opacity="0.8"/>
  <!-- gold chain -->
  <path d="M78 148 Q100 176 122 148" fill="none" stroke="#d9b25f" stroke-width="3" stroke-dasharray="4 2.6"/>

  <!-- neck -->
  <path d="M90 116 H110 V140 Q100 148 90 140 Z" fill="#f8e3ce"/>
  <path d="M90 120 Q100 128 110 120 V116 H90 Z" fill="#eccbb0"/>

  <!-- face -->
  <path d="M66 78 Q66 46 100 46 Q134 46 134 78 Q134 102 122 113 Q110 123 100 123 Q90 123 78 113 Q66 102 66 78 Z" fill="#fbe9d6"/>

  <!-- curtain strands framing the face -->
  <path d="M66 70 Q64 96 70 116 L76 112 Q70 94 72 74 Z" fill="url(#mi-hair)"/>
  <path d="M134 70 Q136 96 130 116 L124 112 Q130 94 128 74 Z" fill="url(#mi-hair)"/>
  <path d="M62 74 Q62 46 100 44 Q138 46 138 74 L136 78 Q124 58 100 58 Q76 58 64 78 Z" fill="url(#mi-hair)"/>

  <!-- denim bucket hat with doodles -->
  <path d="M60 54 Q62 24 100 22 Q138 24 140 54 L142 58 Q100 48 58 58 Z" fill="url(#mi-hat)"/>
  <path d="M48 60 Q100 44 152 60 Q154 68 148 70 Q100 58 52 70 Q46 68 48 60 Z" fill="#434c5b"/>
  <path d="M52 68 Q100 57 148 68" stroke="#57627380" stroke-width="2" fill="none"/>
  <g opacity="0.9" stroke-linecap="round">
    <path d="M76 36 q4 -6 9 -1" stroke="#d9a0c0" stroke-width="2" fill="none"/>
    <path d="M96 30 h10 M101 25 v10" stroke="#9fd0b5" stroke-width="2"/>
    <path d="M118 36 a4.5 4.5 0 1 1 -0.1 0" fill="none" stroke="#e5c580" stroke-width="2"/>
    <path d="M88 44 q3 4 8 2" stroke="#b7c4e6" stroke-width="2" fill="none"/>
  </g>

  <!-- big doe eyes -->
  <g>
    <ellipse cx="85" cy="86" rx="8" ry="8.6" fill="#231a14"/>
    <ellipse cx="115" cy="86" rx="8" ry="8.6" fill="#231a14"/>
    <circle cx="88" cy="82.4" r="2.8" fill="#fff"/>
    <circle cx="118" cy="82.4" r="2.8" fill="#fff"/>
    <circle cx="82.4" cy="89.4" r="1.3" fill="#a5754a" opacity="0.9"/>
    <circle cx="112.4" cy="89.4" r="1.3" fill="#a5754a" opacity="0.9"/>
    <path d="M77 79 Q85 75 93 79" stroke="#19100a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M107 79 Q115 75 123 79" stroke="#19100a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- nose + signature bold red pout -->
  <path d="M99 95 Q97 100 100 102" stroke="#e0b18c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M90 109 Q95 106 100 108 Q105 106 110 109 Q107 118 100 118 Q93 118 90 109 Z" fill="#e04f56"/>
  <path d="M92 109 Q100 112 108 109" stroke="#a83038" stroke-width="1.1" fill="none" stroke-linecap="round"/>
  <ellipse cx="78" cy="99" rx="6" ry="3.2" fill="#f3b3a0" opacity="0.5"/>
  <ellipse cx="122" cy="99" rx="6" ry="3.2" fill="#f3b3a0" opacity="0.5"/>
  <circle cx="124" cy="92" r="1" fill="#6b4a38" opacity="0.8"/>

  <!-- peace-sign hand up by the hat -->
  <g transform="translate(151,44) rotate(14)">
    <path d="M-6 34 Q-12 20 -8 8 Q-6 0 -2 -8 Q0 -12 3 -10 Q6 -8 4 -2 L1 8 L6 -6 Q8 -11 12 -9 Q15 -7 13 -1 L8 12 Q14 16 12 24 Q10 34 2 38 Q-3 38 -6 34 Z" fill="#fbe9d6" stroke="#e2c0a2" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M1 8 L4 -2 M8 12 L12 0" stroke="#e2c0a2" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <path d="M-4 6 l3 1.4 M6 2 l3 1.4" stroke="#31343c" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
